<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post-Tensioned Continuous Beam – 3D Visualization</title>
<style>
:root{--bg:#060f24;--panel:#0b1730;--line:#1f3557;--tx:#f3f6fb;--mut:#9fb2cc;--acc:#ff8c1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;height:100%;grid-template-columns:272px 1fr 252px;grid-template-rows:1fr auto;grid-template-areas:"l s r" "i i i"}
#stage{grid-area:s;position:relative;min-height:0;background:#060f24}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.pan{background:var(--panel);overflow-y:auto;padding:10px 12px;border:0 solid var(--line)}
#left{grid-area:l;border-right-width:1px}#right{grid-area:r;border-left-width:1px}
#info{grid-area:i;max-height:30vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px;color:var(--mut);font-size:12px}
#info b{color:var(--tx);font-weight:600}#info .warn{color:#ffb060}#info .clash{color:#ff6b6b}#info .ok{color:#3fb950}
h3{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:6px 0}.row output{color:var(--mut);font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;margin:2px 0 0;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0}.chk input{accent-color:var(--acc);width:16px;height:16px}
.chk input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);background:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{background:#12223f;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;cursor:pointer}
button:hover,button:active{border-color:var(--acc)}
#views{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}#views button{padding:5px 8px;background:#12223fcc}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
#sec{width:100%;background:#071022;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.note{color:var(--mut);font-size:11.5px;margin-top:8px}
@media(max-width:820px){
 html,body{height:auto}.app{display:block;height:auto}
 #stage{position:sticky;top:env(safe-area-inset-top,0px);height:52vh;z-index:5}
 .pan{overflow:visible;border-width:1px 0 0 0!important}
}
</style></head><body>
<div class="app">
 <div id="stage"><div id="views"></div><div id="toast"></div></div>

</div>

<script>
"use strict";
/* ============ STATE ============ */
// All values are ILLUSTRATIVE visualization assumptions (mm) – not a structural design.
const P0={L:15000,W:1500,D:600,cover:40,barD:20,stD:10,sp:200,nTop:6,nBot:3,nTop2:0,nBot2:0,topExt:.25,botStart:.15,nT:5,nS:4,ecc:150,endY:50,intY:200,nSp:3,curv:2,ductD:50,opac:0.15,colOpac:0.15,bulbL:100,bulbSpread:35,wireD:2,endHookL:0.38,endBendR:5,colN:3,colBarD:20,colTieD:8,colTieSp:150,colExt:800};
let P={...P0}, xs=0;
const V={concrete:true,tendons:true,ducts:true,strands:true,anchors:true,rebar:true,stirrups:true,dims:true,section:false,grid:true,supports:true};
const SCHEMA=[
 ["h","Beam geometry"],
 ["nSp","Number of spans",1,4,1],["L","Span length (each)",2000,30000,250],["W","Width",150,3000,50],["D","Depth",300,3000,50],
 ["h","Conventional reinforcement"],
 ["cover","Cover",15,100,1],["barD","Longitudinal bar Ø",8,40,2],["stD","Stirrup Ø",6,20,2],["sp","Stirrup spacing",75,600,25],["nTop","Main bars, top & bottom (no.)",2,15,1],["nTop2","Additional top bars, between main bars (no.)",0,15,1],["nBot2","Additional bottom bars, between main bars (no.)",0,15,1],["topExt","Top add. bar length from each support (× L)",0.1,0.45,0.01],["botStart","Bottom add. bars start from support (× L)",0.05,0.4,0.01],["endHookL","End 90° hook length (× D)",0.1,1,0.01],["endBendR","End bend radius",1,150,1],
 ["h","Column reinforcement"],
 ["colN","Column bars per face (no.)",2,6,1],["colBarD","Column bar Ø",12,40,2],["colTieD","Column tie Ø",6,16,2],["colTieSp","Column tie spacing",75,400,25],["colExt","Column bars extending above beam",0,2000,50],
 ["h","Post-tensioning tendons"],
 ["nT","Number of tendons",1,10,1],["nS","Strands per tendon",1,15,1],["ductD","Duct Ø",50,100,2],["bulbL","Dead-end bulb length",50,250,5],["bulbSpread","Bulb spread diameter",10,60,1],["wireD","Individual wire diameter",1,4,0.5],
 ["ecc","Eccentricity at midspan (below centroid)",0,1000,5],["endY","High point / anchorage height (above centroid)",-1000,1000,5],["intY","High point over interior supports (above centroid)",-1000,1000,5],
 ["curv","Profile curvature exponent (2 = parabola)",1.2,3.5,0.1],
 ["h","Display"],["opac","Beam opacity",0.05,1,0.05],["colOpac","Column opacity",0.05,1,0.05]
];
/* ============ SCENE ============ */
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=false;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.localClippingEnabled=true;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
// Gradient backgrounds (the canvas is opaque, so the background must live in the scene)
const BG={Navy:["#12397a","#060f24"],Studio:["#9db2cf","#2b3a50"],Blueprint:["#2a62b0","#0d2a52"],Light:["#f4f7fb","#bcc8d8"],Dark:["#2a3342","#07090d"]};
function setBg(n){const c=document.createElement("canvas");c.width=4;c.height=256;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,BG[n][0]);g.addColorStop(1,BG[n][1]);x.fillStyle=g;x.fillRect(0,0,4,256);
 if(scene.background)scene.background.dispose();const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t}
setBg("Light");
const camera=new THREE.PerspectiveCamera(40,1,10,200000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
scene.add(new THREE.AmbientLight(0xffffff,.45));
scene.add(new THREE.HemisphereLight(0xdfe9ff,0x2a2f38,.55));
const sun=new THREE.DirectionalLight(0xffffff,.95);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0x9db8ff,.3);fill.position.set(-3000,1500,-2000);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.35}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(12000,24,0x2b4a7a,0x1a3156);scene.add(grid);

/* ============ MATERIALS (shared, never duplicated) ============ */
function concTex(){ // procedural concrete speckle texture
 const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
 x.fillStyle="#bfc1c4";x.fillRect(0,0,256,256);
 for(let i=0;i<5000;i++){const v=150+Math.random()*80|0;x.fillStyle=`rgba(${v},${v},${v+3},.5)`;x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1+Math.random()*2)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,4);t.encoding=THREE.sRGBEncoding;return t}
const MS=(o)=>new THREE.MeshStandardMaterial(o);
const M={
 conc:MS({map:concTex(),color:0xd4d5d8,roughness:.95,metalness:0,transparent:true,opacity:.25,depthWrite:false}),
 duct:MS({color:0x19b5a5,emissive:0x0a3a35,transparent:true,opacity:.45,roughness:.5,metalness:.3,depthWrite:false}),
 strand:MS({color:0xe8edf3,metalness:.15,roughness:.4,emissive:0x303840}),
 plate:MS({color:0x3b82f6,metalness:.15,roughness:.5,emissive:0x0a1a33}),
 head:MS({color:0xdfe5ec,metalness:.35,roughness:.4}),
 wedge:MS({color:0xef4444,metalness:.15,roughness:.5,emissive:0x330a0a}),
 bar:MS({color:0xd9843f,metalness:.15,roughness:.5,emissive:0x3a1f0a}),
 stir:MS({color:0x3fb950,metalness:.15,roughness:.5,emissive:0x0c2a12}),
 add:MS({color:0xffd23f,metalness:.15,roughness:.5}),
 col:MS({color:0xa7adb6,roughness:.9,metalness:0}),
 colbar:MS({color:0x4da3ff,metalness:.15,roughness:.5,emissive:0x0a1a33}),
 coltie:MS({color:0xc77dff,metalness:.15,roughness:.5,emissive:0x1f0a33})
};
// r128 treats hex colours as linear while output is sRGB: convert once so 3D matches the picked hex
const hx=m=>m.color.clone().convertLinearToSRGB().getHexString();
for(const[k,m]of Object.entries(M)){m.color.convertSRGBToLinear();if(k!=="conc")m.emissive.copy(m.color).multiplyScalar(.08)}
const secPlane=new THREE.Plane(new THREE.Vector3(-1,0,0),0);
function applyClip(){for(const m of Object.values(M)){m.clippingPlanes=V.section?[secPlane]:null;m.needsUpdate=true}}

/* ============ GROUPS ============ */
const root=new THREE.Group();scene.add(root);
const G={};for(const k of ["conc","tend","duct","str","anc","reb","bar","stir","dim","sup"]){G[k]=new THREE.Group();G[k].name=k}
root.add(G.conc,G.tend,G.reb,G.dim,G.sup);G.tend.add(G.duct,G.str,G.anc);G.reb.add(G.bar,G.stir);
const secMark=new THREE.Group();scene.add(secMark);
function clearGroup(g){
 for(const o of [...g.children]){clearGroup(o);g.remove(o);
  if(o.geometry)o.geometry.dispose();
  if(o.isSprite){o.material.map.dispose();o.material.dispose()}
  if(o.userData.ownMat)o.material.dispose()}}

/* ============ GEOMETRY HELPERS ============ */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function tube(parent,pts,r,mat,seg,rad){ // smooth tube along a Catmull-Rom spline
 const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg,r,rad,false),mat);
 m.castShadow=true;parent.add(m);return m}
/** Parametric tendon profile: lowest at midspan (yMid), highest at ends (yEnd). */
const TL=()=>P.L*P.nSp;
let PT=null; // sampled tendon profile, smoothed into reverse curves over interior supports
function rawY(x,g){const T=TL(),n=P.nSp,L=P.L;let s=Math.floor((x+T/2)/L);s=Math.max(0,Math.min(n-1,s));const u=(x+T/2-s*L)/L;
 const yl=s===0?g.yEnd:g.yInt,yr=s===n-1?g.yEnd:g.yInt;
 return u<.5?g.yMid+(yl-g.yMid)*Math.pow(Math.max(0,1-2*u),P.curv):g.yMid+(yr-g.yMid)*Math.pow(Math.max(0,2*u-1),P.curv)}
function makeProfile(g){const T=TL(),M=P.nSp*240,h=.08*P.L,ys=[];
 for(let i=0;i<=M;i++){const x=-T/2+T*i/M;let d=Infinity;for(let k=1;k<P.nSp;k++)d=Math.min(d,Math.abs(x-(-T/2+k*P.L)));
  if(d<2*h){let a=0;for(let j=0;j<=20;j++)a+=rawY(x-h+2*h*j/20,g);ys.push(a/21)}else ys.push(rawY(x,g))}
 PT={T,M,ys}}
function profile(x){const{T,M,ys}=PT,f=Math.max(0,Math.min(M,(x+T/2)/T*M)),i=Math.min(M-1,Math.floor(f)),t=f-i;return ys[i]*(1-t)+ys[i+1]*t}
/** Additional top bars: over interior supports (hogging); at the ends for a single span. Bottom: in every span. */

/**
 * Additional top reinforcement:
 * 1. Left exterior support
 * 2. Right exterior support
 * 3. All interior supports
 *
 * Length is controlled by topExt × span length.
 */
function topSegs(){const T=TL(),Ls=P.L,c=P.cover,e=Ls*P.topExt,o=[];o.push([-T/2+c,-T/2+e]);o.push([T/2-e,T/2-c]);for(let k=1;k<P.nSp;k++){const x=-T/2+k*Ls;o.push([x-e,x+e])}return o}
function botSegs(){const T=TL(),Ls=P.L,o=[];for(let k=0;k<P.nSp;k++){const a=-T/2+k*Ls;o.push([a+Ls*P.botStart,a+Ls*(1-P.botStart)])}return o}
/** Strand layout inside a duct: ring of up to 6 (r=12) then outer ring (r=19). Returns [dy,dz] pairs. */
function strandOffsets(n){
 if(n===1)return[[0,0]];const a=Math.min(n,5),o=[];
 for(let i=0;i<a;i++){const t=2*Math.PI*i/a;o.push([10*Math.cos(t),10*Math.sin(t)])}
 const b=n-a;for(let i=0;i<b;i++){const t=2*Math.PI*(i+.5)/b;o.push([19*Math.cos(t),19*Math.sin(t)])}
 return o}
/** Closed rectangular stirrup with rounded corners, centreline path in the Y-Z plane. */
function stirrupGeom(W,D,c,sd){
 const hw=W/2-c-sd/2,hh=D/2-c-sd/2,r=2.5*sd,v=(y,z)=>V3(0,y,z),path=new THREE.CurvePath();
 const L=(a,b)=>path.add(new THREE.LineCurve3(a,b)),Q=(a,k,b)=>path.add(new THREE.QuadraticBezierCurve3(a,k,b));
 L(v(hh,-hw+r),v(hh,hw-r));Q(v(hh,hw-r),v(hh,hw),v(hh-r,hw));
 L(v(hh-r,hw),v(-hh+r,hw));Q(v(-hh+r,hw),v(-hh,hw),v(-hh,hw-r));
 L(v(-hh,hw-r),v(-hh,-hw+r));Q(v(-hh,-hw+r),v(-hh,-hw),v(-hh+r,-hw));
 L(v(-hh+r,-hw),v(hh-r,-hw));Q(v(hh-r,-hw),v(hh,-hw),v(hh,-hw+r));
 return new THREE.TubeGeometry(path,96,sd/2,8,true)}
/** Evenly spaced main bars: [y,z] pairs for the top and bottom layers. */
function barList(){const{W,D,cover:c,barD:d,stD:sd,nTop,nTop2,nBot2}=P,yb=D/2-c-sd-d/2,zb=W/2-c-sd-d/2,o=[],y2=yb-(d+25);
 // type 0 = main bar (full length), 1 = additional top bar (near supports), 2 = additional bottom bar (midspan)
 const row=(n,y,t)=>{for(let i=0;i<n;i++)o.push([y,n>1?-zb+2*zb*i/(n-1):0,t])};row(nTop,yb,0);row(nTop,-yb,0);
 // additional bars sit in the SAME layer as the main bars, inside the gaps between them.
 // k bars are shared out over the gaps (any number: 2+ per gap when k > gaps) and spaced evenly within each gap.
 const gaps=Math.max(0,nTop-1),
  pick=k=>{if(k<=0)return[];if(k===1)return[Math.floor((gaps-1)/2)];return Array.from({length:k},(_,j)=>Math.round(j*(gaps-1)/(k-1)))},
  place=(k,y,t)=>{if(!gaps||k<=0)return;const base=Math.floor(k/gaps),ex=new Set(pick(k%gaps));
   for(let i=0;i<gaps;i++){const m=base+(ex.has(i)?1:0),z0=-zb+2*zb*i/(nTop-1),z1=-zb+2*zb*(i+1)/(nTop-1);
    for(let j=1;j<=m;j++)o.push([y,z0+(z1-z0)*j/(m+1),t])}};
 place(nTop2,yb,1);place(nBot2,-yb,2);
 return o}
/** Stirrup leg positions = one per main bar column (largest layer sets the grid), so legs sit on the bars. */
function legZ(){const{W,cover:c,barD:d,stD:sd}=P,zb=W/2-c-sd-d/2,n=Math.max(2,P.nTop);return Array.from({length:n},(_,i)=>-zb+2*zb*i/(n-1))}
/** One closed hoop spanning z = zl..zr (centreline, Y-Z plane). Corners are true circular arcs concentric with the
    corner main bar (radius = (barD+stD)/2), so the stirrup bends around the OUTSIDE of the bar and hugs it. */
class ArcC extends THREE.Curve{constructor(cy,cz,r,a0,a1){super();this.cy=cy;this.cz=cz;this.r=r;this.a0=a0;this.a1=a1}
 getPoint(t,o=new THREE.Vector3()){const a=this.a0+(this.a1-this.a0)*t;return o.set(0,this.cy+this.r*Math.cos(a),this.cz+this.r*Math.sin(a))}}
function hoop(zl,zr){const{D,cover:c,barD:d,stD:sd}=P,hh=D/2-c-sd/2,r=Math.max(1,Math.min((d+sd)/2,(zr-zl)/2-1)),v=(y,z)=>V3(0,y,z),path=new THREE.CurvePath(),H=Math.PI/2;
 const L=(a,b)=>path.add(new THREE.LineCurve3(a,b)),A=(cy,cz,a0)=>path.add(new ArcC(cy,cz,r,a0,a0+H));
 L(v(hh,zl+r),v(hh,zr-r));A(hh-r,zr-r,0);
 L(v(hh-r,zr),v(-hh+r,zr));A(-hh+r,zr-r,H);
 L(v(-hh,zr-r),v(-hh,zl+r));A(-hh+r,zl+r,2*H);
 L(v(-hh+r,zl),v(hh-r,zl));A(hh-r,zl+r,3*H);
 return new THREE.TubeGeometry(path,160,sd/2,8,true)}
/** Stirrup legs: outer hoop (2 legs) plus inner hoops for each extra pair of legs. */
/** Straight cross-tie (single leg) at z, used when the count of interior legs is odd. */
function tie(z){const{D,cover:c,stD:sd}=P,g=new THREE.CylinderGeometry(sd/2,sd/2,D-2*c-sd,8);g.translate(0,0,z);return g}
/** Outer hoop wraps the outermost bars; inner hoops each wrap a pair of bars, so every leg holds a main bar. */
function stirrupSet(){const{barD:d,stD:sd}=P,z=legZ(),n=z.length,o=(d+sd)/2,g=[hoop(z[0]-o,z[n-1]+o)];
 let i=1;for(;i+1<n-1;i+=2)g.push(hoop(z[i]-o,z[i+1]+o));
 if(i===n-2)g.push(tie(z[i]+o));return g}
/** Square column tie in the X-Z plane (centreline half-size h), corners are arcs wrapping the corner bar. */
function colTieGeom(h,r,sd){
 const v=(y,z)=>V3(0,y,z),path=new THREE.CurvePath(),H=Math.PI/2,L=(a,b)=>path.add(new THREE.LineCurve3(a,b)),A=(cy,cz,a0)=>path.add(new ArcC(cy,cz,r,a0,a0+H));
 L(v(h,-h+r),v(h,h-r));A(h-r,h-r,0);L(v(h-r,h),v(-h+r,h));A(-h+r,h-r,H);
 L(v(-h,h-r),v(-h,-h+r));A(-h+r,-h+r,2*H);L(v(-h+r,-h),v(h-r,-h));A(h-r,-h+r,3*H);
 const g=new THREE.TubeGeometry(path,160,sd/2,8,true);g.rotateZ(Math.PI/2);return g}
function label(text,pos,col,k){
 const c=document.createElement("canvas");c.width=512;c.height=112;const x=c.getContext("2d");
 x.fillStyle="rgba(15,20,27,.9)";x.fillRect(0,0,512,112);x.strokeStyle=col;x.lineWidth=5;x.strokeRect(2,2,508,108);
 x.fillStyle=col;x.font="bold 44px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(text,256,58);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
 s.scale.set(k*4.57,k,1);s.position.copy(pos);s.renderOrder=10;return s}
/** Dimension line a→b with end dots and a millimetre label at its midpoint. */
function dim(a,b,text,col,k,sg){
 const g=G.dim,l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:col,depthTest:false}));
 l.renderOrder=9;l.userData.ownMat=true;g.add(l);
 for(const p of[a,b]){const s=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:col,depthTest:false}));s.position.copy(p);s.userData.ownMat=true;g.add(s)}
 const m=a.clone().add(b).multiplyScalar(.5);m.y+=Math.abs(a.y-b.y)<1?k*.9:0;g.add(label(text,m,"#"+new THREE.Color(col).getHexString(),k))}

/* ============ CLASH CHECK: tendon ducts vs beam rebar, stirrups, hooks and column bars ============ */
function checkClashes(L,pitch,k){
 const{W,D,cover:c,barD:d,stD:sd,nT,ductD,colN:cn,colBarD:cd,colTieD:ct,endHookL,endBendR}=P,R=ductD/2,cw=Math.min(W,600),hh=D/2-c-sd/2;
 const tz=Array.from({length:nT},(_,i)=>(i-(nT-1)/2)*pitch),N=400,xs=Array.from({length:N+1},(_,j)=>-L/2+L*j/N),ys=xs.map(x=>profile(x));
 const out={},hits=[],add=(cat,txt,x,y,z)=>{(out[cat]=out[cat]||[]).push(txt);hits.push([x,y,z])};
 const f=v=>Math.round(v);
 // 1) longitudinal bars (main + additional) vs duct, along the whole bar length
 for(const[by,bz,bt]of barList()){

const xr=el("label","row",`<span>Position along length</span><output></output><input id="xs" type="range" min="-3000" max="3000" step="10" value="0">`);
xr.querySelector("input").oninput=e=>{xs=+e.target.value;xr.querySelector("output").textContent=xs+" mm";updateSection();
 document.getElementById("info").innerHTML=document.getElementById("info").innerHTML.replace(/section x = -?\d+ mm/,`section x = ${xs} mm`)};
xr.querySelector("output").textContent="0 mm";right.append(xr);
right.insertAdjacentHTML("beforeend",`<svg id="sec" viewBox="0 0 400 600"></svg><div class="note">Cross-section at the plane: concrete (grey), stirrup (green), bars (copper), duct (teal) with strands (white). Positions are illustrative.</div>`);
right.append(el("h3",0,"Export"));
const eb=el("div","btns"),bP=el("button",0,"PNG screenshot"),bG=el("button",0,"GLB model (.zip)");eb.append(bP,bG);right.append(eb);
// camera views
function fit(ext){const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));return ext/2/(t*Math.min(camera.aspect,1.8))*1.2}
function setView(n){
 const{W,D}=P,L=TL(),dL=fit(Math.max(L,D*1.8)),dS=Math.max(D/2/Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),W/2/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect))*1.6;
 const p={front:[0,0,dL],side:[dS+L/2*0+1200,0,0],top:[0,dL*.95,1],iso:[dL*.40,dL*.24,dL*.42]}[n];
 controls.target.set(0,0,0);camera.position.set(...p);camera.up.set(0,1,0);camera.lookAt(0,0,0);controls.update()}
const vb=document.getElementById("views");
for(const[n,l]of[["iso","Isometric"],["front","Front"],["side","Side"],["top","Top"]]){const b=el("button",0,l);b.onclick=()=>setView(n);vb.append(b)}
const br=el("button",0,"Reset camera");br.onclick=()=>setView("iso");vb.append(br);
// export
const toast=(t)=>{const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2800)};
async function save(name,data){
 let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:name,data})}catch(e){if(!e||e.code!=="declined")toast("Download failed: "+((e&&e.code)||"error"))}return}
 const a=document.createElement("a"),u=URL.createObjectURL(data);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Saved "+name)}
bP.onclick=()=>{renderer.render(scene,camera);renderer.domElement.toBlob(b=>b&&save("pt-beam.png",b),"image/png")};
bG.onclick=()=>{
 const hide=[G.dim,secMark],prev=hide.map(o=>o.visible);hide.forEach(o=>o.visible=false);
 new THREE.GLTFExporter().parse(root,async buf=>{
  hide.forEach((o,i)=>o.visible=prev[i]);
  const z=new JSZip();z.file("pt-beam.glb",buf);save("pt-beam-glb.zip",await z.generateAsync({type:"blob"}))
 },{binary:true})};
// resize + loop
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);
build();resize();setView("iso");
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
